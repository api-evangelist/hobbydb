aid: hobbydb
name: hobbyDB
description: hobbyDB is a database and marketplace for collectibles — a platform that
  lets anyone catalog, offer, buy, and sell just about any collectible (Funko Pops,
  action figures, trading cards, die-cast, and more) at any time, from anywhere, in
  auction-style or fixed-price formats. It pairs a community-curated reference database
  of collectible items and variants with personal collection-management tools (lists,
  condition and grading tracking, pre-orders, trades, and import/export) and a peer-to-peer
  marketplace for transactions between collectors. hobbyDB is a Techstars-backed company.
